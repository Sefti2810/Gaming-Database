<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sammlung-Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5652c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🎮</text></svg>">
<script>
// Frueh (vor dem CSS-Rendering) gespeicherten Dark-Mode anwenden, damit die Seite
// nicht kurz hell aufblitzt, bevor auf dunkel umgeschaltet wird.
(function () {
  try {
    var saved = localStorage.getItem("sammlung-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<section id="view-login" class="view">
  <div class="login-box">
    <h1>🎮 Sammlung-Tracker</h1>
    <p class="muted">Bitte anmelden.</p>
    <form id="login-form">
      <label>E-Mail<input type="email" id="login-email" required autocomplete="username"></label>
      <label>Passwort<input type="password" id="login-password" required autocomplete="current-password"></label>
      <button type="submit" class="btn-primary">Anmelden</button>
      <div id="login-error" class="status-text error"></div>
    </form>
  </div>
</section>

<!-- App shell -->
<div id="app-shell" class="hidden">
  <header class="topbar">
    <a class="brand" href="#/">🎮 Sammlung-Tracker</a>
    <nav>
      <button id="theme-toggle" class="link-btn" type="button" title="Darstellung wechseln">🌙</button>
    </nav>
  </header>
  <div id="flash" class="flash hidden"></div>
  <main id="main"></main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Hauptnavigation">
    <a href="#/" class="bottom-nav-item" title="Übersicht"><span class="bottom-nav-icon">🏠</span></a>
    <a href="#/favoriten" class="bottom-nav-item" title="Favoriten"><span class="bottom-nav-icon">⭐</span></a>
    <a href="#/add" class="bottom-nav-item bottom-nav-add" title="Artikel hinzufügen"><span class="bottom-nav-icon">➕</span></a>
    <a href="#/coop" class="bottom-nav-item" title="Koop/Kampagne"><span class="bottom-nav-icon">🎮</span></a>
    <a href="#/dashboard" class="bottom-nav-item" title="Dashboard"><span class="bottom-nav-icon">📋</span></a>
  </nav>
</div>

<!-- Templates -->
<template id="tpl-index">
  <form class="filters" id="filter-form">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" name="q" id="q-input" placeholder="Suche: Titel, Konsole, Details…">
    </div>
    <details class="ms-filter" id="type-filter">
      <summary>Typ <span class="ms-count"></span></summary>
      <div class="ms-options"></div>
    </details>
    <details class="ms-filter" id="console-filter">
      <summary>Konsole <span class="ms-count"></span></summary>
      <div class="ms-options"></div>
    </details>
    <details class="ms-filter" id="sale-status-filter">
      <summary>Status <span class="ms-count"></span></summary>
      <div class="ms-options"></div>
    </details>
    <!-- Koop-/Favoriten-Filter sind aus der sichtbaren Filterliste entfernt (Stefan-Feedback:
         redundant, da bereits als eigene Icons in der Bottom-Navigation vorhanden). Die
         Checkboxen bleiben unsichtbar im Formular bestehen, damit #/coop und #/favoriten
         (renderIndex(preset)) sie weiterhin per JS setzen/lesen koennen, ohne die bestehende
         Filter-Logik/FormData anfassen zu muessen. -->
    <input type="checkbox" name="coop_only" id="coop-only-filter" hidden>
    <input type="checkbox" name="favorites_only" id="favorites-only-filter" hidden>
    <select name="sort">
      <option value="created_desc">Neueste zuerst</option>
      <option value="created_asc">Älteste zuerst</option>
      <option value="title_asc">Titel A–Z</option>
      <option value="title_desc">Titel Z–A</option>
      <option value="value_desc">Wert absteigend</option>
      <option value="value_asc">Wert aufsteigend</option>
      <option value="purchase_desc">Kaufpreis absteigend</option>
      <option value="purchase_asc">Kaufpreis aufsteigend</option>
      <option value="profit_desc">Potentieller Gewinn absteigend</option>
      <option value="profit_asc">Potentieller Gewinn aufsteigend</option>
      <option value="margin_desc">Rendite % absteigend</option>
      <option value="margin_asc">Rendite % aufsteigend</option>
    </select>
  </form>
  <div class="list-toolbar">
    <div class="item-count" id="item-count"></div>
    <div class="view-toggle" role="group" aria-label="Ansicht">
      <span class="view-toggle-indicator" id="view-toggle-indicator"></span>
      <button type="button" id="view-grid-btn" class="view-btn" title="Karten (Zeilenübersicht mit Foto)">🔲</button>
      <button type="button" id="view-list-btn" class="view-btn" title="Liste (nur Daten, ohne Foto)">📋</button>
      <button type="button" id="view-storage-btn" class="view-btn" title="Nach Lagerort gruppiert">🗄️</button>
      <button type="button" id="view-cube-btn" class="view-btn" title="Würfel (kompakte Kacheln)">🧊</button>
    </div>
  </div>
  <div id="filter-chips" class="filter-chips hidden"></div>
  <div id="bulk-toolbar" class="bulk-toolbar hidden">
    <span id="bulk-count" class="status-text"></span>
    <select id="bulk-sale-status">
      <option value="__keep__" selected>Status ändern…</option>
      <option value="">– kein Vermerk –</option>
      <option value="for_sale">Zum Verkauf vorgesehen</option>
      <option value="reserved">Reserviert</option>
      <option value="sold">Verkauft</option>
      <option value="not_for_sale">Nicht zu verkaufen</option>
    </select>
    <button type="button" id="bulk-apply-status" class="btn-secondary small">Anwenden</button>
    <input type="text" id="bulk-storage-location" placeholder="Neuer Lagerort…">
    <button type="button" id="bulk-apply-storage" class="btn-secondary small">Anwenden</button>
    <input type="text" id="bulk-console" placeholder="Konsole umbenennen…">
    <button type="button" id="bulk-apply-console" class="btn-secondary small">Anwenden</button>
    <button type="button" id="bulk-clear" class="link-btn">Auswahl aufheben</button>
  </div>
  <div id="list-header" class="list-header hidden">
    <span class="list-check"><input type="checkbox" id="list-select-all" title="Alle auswählen"></span>
    <span></span>
    <span>Typ</span><span>Titel</span><span>Konsole</span><span>Status</span><span>Kauf</span><span>Wert</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="storage-view" class="storage-view hidden"></div>
  <div id="empty-state" class="empty-state hidden"></div>
</template>

<template id="tpl-dashboard">
  <h1>📋 Dashboard</h1>
  <section class="stats" id="stats"></section>
  <details class="console-breakdown" id="console-breakdown">
    <summary>📊 Aufschlüsselung nach Konsole</summary>
    <div id="console-breakdown-body"></div>
  </details>

  <div class="stat-section">
    <h2>🔗 Organisatorisches</h2>
    <div class="dashboard-links">
      <a href="#/verkaufen" class="dashboard-link">🏷️ Verkaufen</a>
      <a href="#/statistik" class="dashboard-link">📊 Statistiken</a>
      <a href="#/import" class="dashboard-link">📥 Import</a>
      <button type="button" id="dash-export-btn" class="dashboard-link">📤 Export (CSV)</button>
      <button type="button" id="dash-export-pdf-btn" class="dashboard-link">📄 PDF-Export</button>
      <button type="button" id="dash-logout-btn" class="dashboard-link dashboard-link-danger">🚪 Abmelden</button>
    </div>
  </div>
</template>

<template id="tpl-verkaufen">
  <h1>🏷️ Verkaufen</h1>
  <section class="stats" id="sell-stats"></section>
  <div id="sell-toolbar" class="sell-toolbar hidden">
    <label class="select-all-label"><input type="checkbox" id="list-select-all"> Alle auswählen</label>
    <span class="status-text">Mehrere Artikel auswählen, um einen Paketpreis zu berechnen.</span>
  </div>
  <div id="sell-list" class="sell-list"></div>
  <div id="sell-empty" class="empty-state hidden">
    <div class="empty-state-icon">🏷️</div>
    <p>Aktuell ist kein Artikel zum Verkauf vorgesehen.</p>
    <p class="empty-sub">Setze bei einem Artikel den Verkaufsstatus auf „Zum Verkauf vorgesehen“, damit er hier erscheint.</p>
  </div>
  <div id="package-calc" class="calc-box hidden">
    <h3>📦 Paket-Rechner</h3>
    <div id="package-items" class="package-items"></div>
    <div class="calc-grid">
      <label>Paketpreis (€)<input type="number" step="0.01" min="0" id="package-price" placeholder="z. B. 45"></label>
    </div>
    <div id="package-result" class="package-result"></div>
  </div>
  <details class="console-breakdown" id="sold-history">
    <summary>📜 Verkaufshistorie</summary>
    <div id="sold-history-body"></div>
  </details>
</template>

<template id="tpl-statistik">
  <h1>📊 Statistiken</h1>
  <section class="stats" id="stat-stats"></section>

  <div class="stat-section">
    <h2>🎮 Aufteilung nach Konsole</h2>
    <div id="stat-console-breakdown"></div>
  </div>

  <div class="stat-section">
    <h2>🗂️ Aufteilung nach Genre</h2>
    <div id="stat-genre-breakdown"></div>
  </div>

  <div class="stat-toplists">
    <div class="stat-section">
      <h2>💎 Wertvollste Artikel</h2>
      <div id="stat-top-value"></div>
    </div>
    <div class="stat-section">
      <h2>📈 Größte Gewinne</h2>
      <div id="stat-top-profit"></div>
    </div>
    <div class="stat-section">
      <h2>🏆 Beste Renditen</h2>
      <div id="stat-top-margin"></div>
    </div>
  </div>
</template>

<template id="tpl-add">
  <h1>Neuen Artikel hinzufügen</h1>
  <div id="no-key-notice" class="notice hidden">
    KI-Bilderkennung ist (noch) nicht eingerichtet – du kannst trotzdem ein Foto anhängen
    und alle Felder manuell ausfüllen.
  </div>
  <form id="item-form" class="item-form">
    <div class="photo-section">
      <label class="photo-drop" id="photo-drop">
        <input type="file" id="photo-input" accept="image/*" multiple>
        <span id="photo-drop-text">📷 Foto aufnehmen oder Datei(en) auswählen</span>
        <div id="photo-previews" class="photo-previews"></div>
      </label>
      <button type="button" id="analyze-btn" class="btn-secondary" disabled>🤖 Mit KI erkennen</button>
      <div id="analyze-status" class="status-text"></div>
      <div id="analyze-result" class="ai-review hidden">
        <h4>🔍 Erkannte Daten</h4>
        <div id="analyze-result-body" class="ai-review-body"></div>
        <div class="ai-review-actions">
          <button type="button" id="analyze-apply" class="btn-secondary small">✅ Übernehmen</button>
          <button type="button" id="analyze-discard" class="btn-link">Verwerfen</button>
        </div>
      </div>
    </div>
    <div class="field-grid">
      <label>Typ
        <select name="type" id="f-type">
          <option value="spiel">Spiel</option>
          <option value="konsole">Konsole</option>
          <option value="zubehoer">Zubehoer</option>
        </select>
      </label>
      <label>Titel / Bezeichnung<input type="text" name="title" id="f-title" placeholder="z. B. Super Mario Sunshine"></label>
      <label>Konsole / Plattform
        <input type="text" name="console" id="f-console" placeholder="z. B. Nintendo GameCube">
      </label>
      <label>Kategorie / Genre<input type="text" name="category" id="f-category" placeholder="z. B. Jump'n'Run, Handheld, Controller"></label>
      <label>Zustand<input type="text" name="condition" id="f-condition" placeholder="z. B. OVP, wie neu"></label>
      <label class="full">Details<textarea name="details" id="f-details" rows="2" placeholder="Region, Edition, Bundle-Inhalt, Besonderheiten…"></textarea></label>
      <label>Kaufpreis (€)<input type="number" step="0.01" min="0" name="purchase_price" id="f-purchase"></label>
      <label>Geschätzter Marktwert (€)<input type="number" step="0.01" min="0" name="estimated_value" id="f-estimated"></label>
      <label>Wunschpreis (€)<input type="number" step="0.01" min="0" name="asking_price" id="f-asking" placeholder="für welchen Preis anbieten?"></label>
      <label>Mindestpreis (€)<input type="number" step="0.01" min="0" name="minimum_price" id="f-minimum" placeholder="nicht darunter verkaufen"></label>
      <label>Region / Sprache<input type="text" name="region" id="f-region" placeholder="z. B. PAL (DE)"></label>
      <label>Verkaufsstatus
        <select name="sale_status" id="f-sale-status">
          <option value="">– kein Vermerk –</option>
          <option value="for_sale">Zum Verkauf vorgesehen</option>
          <option value="reserved">Reserviert</option>
          <option value="sold">Verkauft</option>
          <option value="not_for_sale">Nicht zu verkaufen</option>
        </select>
      </label>
      <label>Tatsächlicher Verkaufspreis (€)<input type="number" step="0.01" min="0" name="sold_price" id="f-sold-price" placeholder="nur wenn bereits verkauft"></label>
      <label>Lagerort<input type="text" name="storage_location" id="f-storage-location" placeholder="z. B. Regal 2, Kiste B"></label>
      <label class="checkbox-inline"><input type="checkbox" name="coop_campaign" id="f-coop"> 🎮 Koop-/Splitscreen-Kampagne</label>
      <label class="checkbox-inline"><input type="checkbox" name="is_favorite" id="f-favorite"> ⭐ Favorit</label>
      <label class="full">Notizen<textarea name="notes" id="f-notes" rows="2"></textarea></label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-primary">Speichern</button>
      <a href="#/" class="btn-secondary">Abbrechen</a>
    </div>
    <div id="save-status" class="status-text"></div>
  </form>
</template>

<template id="tpl-import">
  <h1>Bestehende Sammlung importieren</h1>
  <div class="notice">
    Füg unten deine Liste ein – egal ob Stichpunkte, Notizen oder ganze Sätze
    (z. B. „GameCube mit 2 Controllern, 30€ gezahlt", „Zelda Wind Waker, OVP").
    Die KI zerlegt das in einzelne Artikel, die du danach prüfen und korrigieren kannst,
    bevor irgendetwas gespeichert wird.
  </div>
  <div class="item-form">
    <label class="full" style="display:flex;flex-direction:column;gap:5px;font-size:0.85rem;color:var(--text-muted);margin-bottom:14px;">
      Deine Liste
      <textarea id="import-text" rows="8" placeholder="z. B.&#10;PS2 gekauft für 40€, funktioniert einwandfrei&#10;GTA San Andreas, OVP, ca. 15€ wert&#10;Nintendo DS Lite, weiß, mit Ladekabel"></textarea>
    </label>
    <div class="form-actions">
      <button type="button" id="parse-btn" class="btn-primary">🤖 Liste analysieren</button>
      <button type="button" id="add-row-btn" class="btn-secondary hidden">+ Zeile manuell hinzufügen</button>
    </div>
    <div id="import-status" class="status-text"></div>
  </div>

  <div id="import-review" class="import-review hidden">
    <h2>Gefundene Artikel – bitte prüfen</h2>
    <div class="table-scroll">
      <table class="import-table" id="import-table">
        <thead>
          <tr>
            <th></th>
            <th>Typ</th>
            <th>Titel</th>
            <th>Konsole</th>
            <th>Kategorie</th>
            <th>Zustand</th>
            <th>Kaufpreis €</th>
            <th>Wert €</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="import-tbody"></tbody>
      </table>
    </div>
    <div class="form-actions">
      <button type="button" id="import-confirm-btn" class="btn-primary">Ausgewählte Artikel importieren</button>
      <span id="import-count" class="status-text"></span>
    </div>
    <div id="import-final-status" class="status-text"></div>
  </div>
</template>

<template id="tpl-item">
  <a class="back-link" href="#/">← Zur Übersicht</a>
  <div class="item-detail">
    <div class="item-photos" id="item-photos"></div>
    <label class="btn-secondary small add-photo-label">
      + Foto hinzufügen
      <input type="file" id="add-photo-input" accept="image/*" multiple style="display:none">
    </label>
    <form class="item-form" id="edit-form">
      <div class="field-grid">
        <label>Typ
          <select name="type" id="e-type">
            <option value="spiel">Spiel</option>
            <option value="konsole">Konsole</option>
            <option value="zubehoer">Zubehoer</option>
          </select>
        </label>
        <label>Titel / Bezeichnung<input type="text" name="title" id="e-title"></label>
        <label>Konsole / Plattform<input type="text" name="console" id="e-console"></label>
        <label>Kategorie / Genre<input type="text" name="category" id="e-category"></label>
        <label>Zustand<input type="text" name="condition" id="e-condition"></label>
        <label class="full">Details<textarea name="details" id="e-details" rows="2"></textarea></label>
        <label>Kaufpreis (€)<input type="number" step="0.01" min="0" name="purchase_price" id="e-purchase"></label>
        <label>Geschätzter Marktwert (€)<input type="number" step="0.01" min="0" name="estimated_value" id="e-estimated"></label>
        <label>Wunschpreis (€)<input type="number" step="0.01" min="0" name="asking_price" id="e-asking" placeholder="für welchen Preis anbieten?"></label>
        <label>Mindestpreis (€)<input type="number" step="0.01" min="0" name="minimum_price" id="e-minimum" placeholder="nicht darunter verkaufen"></label>
        <label>Region / Sprache<input type="text" name="region" id="e-region" placeholder="z. B. PAL (DE)"></label>
        <label>Verkaufsstatus
          <select name="sale_status" id="e-sale-status">
            <option value="">– kein Vermerk –</option>
            <option value="for_sale">Zum Verkauf vorgesehen</option>
            <option value="reserved">Reserviert</option>
            <option value="sold">Verkauft</option>
            <option value="not_for_sale">Nicht zu verkaufen</option>
          </select>
        </label>
        <label>Tatsächlicher Verkaufspreis (€)<input type="number" step="0.01" min="0" name="sold_price" id="e-sold-price" placeholder="nur wenn bereits verkauft"></label>
        <label>Lagerort<input type="text" name="storage_location" id="e-storage-location" placeholder="z. B. Regal 2, Kiste B"></label>
        <label class="checkbox-inline"><input type="checkbox" name="coop_campaign" id="e-coop"> 🎮 Koop-/Splitscreen-Kampagne</label>
        <label class="checkbox-inline"><input type="checkbox" name="is_favorite" id="e-favorite"> ⭐ Favorit</label>
        <label class="full">Notizen<textarea name="notes" id="e-notes" rows="2"></textarea></label>
      </div>
      <div id="ai-note" class="ai-note hidden"></div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Änderungen speichern</button>
        <button type="button" id="estimate-btn" class="btn-secondary">🤖 Preis mit KI schätzen</button>
      </div>
      <div id="estimate-status" class="status-text"></div>
      <div id="estimate-result" class="ai-review hidden">
        <div id="estimate-result-body" class="ai-review-body"></div>
        <div class="ai-review-actions">
          <button type="button" id="estimate-apply" class="btn-secondary small">✅ Übernehmen</button>
          <button type="button" id="estimate-discard" class="btn-link">Verwerfen</button>
        </div>
      </div>
    </form>
    <div id="calc-box" class="calc-box">
      <h3>💰 Gewinnrechner</h3>
      <div class="calc-grid">
        <label>Kaufpreis (€)<input type="number" step="0.01" min="0" id="calc-purchase"></label>
        <label>Verkaufspreis (€)<input type="number" step="0.01" min="0" id="calc-sale"></label>
      </div>
      <div class="calc-result">
        <span>Gewinn: <strong id="calc-profit">–</strong></span>
        <span>Rendite: <strong id="calc-margin">–</strong></span>
      </div>
    </div>
    <div id="listing-box" class="listing-box hidden">
      <button type="button" id="listing-btn" class="btn-secondary">📋 Angebotstext erstellen</button>
      <div id="listing-output" class="listing-output hidden">
        <textarea id="listing-text" rows="6" readonly></textarea>
        <button type="button" id="listing-copy-btn" class="btn-secondary small">In Zwischenablage kopieren</button>
        <span id="listing-copy-status" class="status-text"></span>
      </div>
    </div>
    <form id="delete-form">
      <button type="submit" class="btn-danger">Artikel löschen</button>
    </form>
  </div>
</template>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
