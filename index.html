<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sammlung-Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b5652c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>🎮</text></svg>">
<script>
// Frueh (vor dem CSS-Rendering) gespeicherten Dark-Mode anwenden, damit die Seite
// nicht kurz hell aufblitzt, bevor auf dunkel umgeschaltet wird.
(function () {
  try {
    var saved = localStorage.getItem("sammlung-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login -->
<section id="view-login" class="view">
  <div class="login-box">
    <h1>🎮 Sammlung-Tracker</h1>
    <p class="muted">Bitte anmelden.</p>
    <form id="login-form">
      <label>E-Mail<input type="email" id="login-email" required autocomplete="username"></label>
      <label>Passwort<input type="password" id="login-password" required autocomplete="current-password"></label>
      <button type="submit" class="btn-primary">Anmelden</button>
      <div id="login-error" class="status-text error"></div>
    </form>
  </div>
</section>

<!-- App shell -->
<div id="app-shell" class="hidden">
  <header class="topbar">
    <a class="brand" href="#/">🎮 Sammlung-Tracker</a>
    <nav>
      <a href="#/">Übersicht</a>
      <a href="#/add" class="btn-primary-nav">+ Artikel</a>
      <a href="#/import">Import</a>
      <button id="export-btn" class="link-btn">Export</button>
      <button id="theme-toggle" class="link-btn" type="button" title="Darstellung wechseln">🌙</button>
      <button id="logout-btn" class="link-btn">Abmelden</button>
    </nav>
  </header>
  <div id="flash" class="flash hidden"></div>
  <main id="main"></main>
</div>

<!-- Templates -->
<template id="tpl-index">
  <section class="stats" id="stats"></section>
  <form class="filters" id="filter-form">
    <input type="text" name="q" placeholder="Suche: Titel, Konsole, Details…">
    <select name="type">
      <option value="">Alle Typen</option>
      <option value="konsole">Konsole</option>
      <option value="spiel">Spiel</option>
      <option value="zubehoer">Zubehoer</option>
    </select>
    <select name="console" id="console-filter"><option value="">Alle Konsolen</option></select>
    <details class="ms-filter" id="sale-status-filter">
      <summary>Status <span class="ms-count"></span></summary>
      <div class="ms-options">
        <label><input type="checkbox" name="sale_status" value="" checked> Ohne Vermerk</label>
        <label><input type="checkbox" name="sale_status" value="for_sale" checked> Zum Verkauf vorgesehen</label>
        <label><input type="checkbox" name="sale_status" value="reserved" checked> Reserviert</label>
        <label><input type="checkbox" name="sale_status" value="sold" checked> Verkauft</label>
        <label><input type="checkbox" name="sale_status" value="not_for_sale" checked> Nicht zu verkaufen</label>
        <div class="ms-actions">
          <button type="button" class="ms-all">Alle</button>
          <button type="button" class="ms-none">Keine</button>
        </div>
      </div>
    </details>
    <select name="sort">
      <option value="created_desc">Neueste zuerst</option>
      <option value="created_asc">Älteste zuerst</option>
      <option value="title_asc">Titel A–Z</option>
      <option value="value_desc">Wert absteigend</option>
      <option value="value_asc">Wert aufsteigend</option>
    </select>
    <div class="view-toggle" role="group" aria-label="Ansicht">
      <button type="button" id="view-grid-btn" class="view-btn" title="Kartenansicht (mit Fotos)">🔲 Karten</button>
      <button type="button" id="view-list-btn" class="view-btn" title="Listenansicht (schneller Überblick, ohne Fotos)">📋 Liste</button>
    </div>
  </form>
  <div id="list-header" class="list-header hidden">
    <span>Typ</span><span>Titel</span><span>Konsole</span><span>Status</span><span>Kauf</span><span>Wert</span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty-state" class="empty-state hidden">
    <p>Noch keine Artikel erfasst.</p>
    <a class="btn-primary" href="#/add">Ersten Artikel hinzufügen</a>
  </div>
</template>

<template id="tpl-add">
  <h1>Neuen Artikel hinzufügen</h1>
  <div id="no-key-notice" class="notice hidden">
    KI-Bilderkennung ist (noch) nicht eingerichtet – du kannst trotzdem ein Foto anhängen
    und alle Felder manuell ausfüllen.
  </div>
  <form id="item-form" class="item-form">
    <div class="photo-section">
      <label class="photo-drop" id="photo-drop">
        <input type="file" id="photo-input" accept="image/*" capture="environment" multiple>
        <span id="photo-drop-text">📷 Foto
